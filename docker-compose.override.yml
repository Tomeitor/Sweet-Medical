services:
  backend:
    build:
      dockerfile: Dockerfile
    command: ["node", "--watch", "--env-file=.env", "server.js"]
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
